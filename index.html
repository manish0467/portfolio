<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface-2: #17171f;
    --border: #26262f;
    --text: #dcdce4;
    --dim: #8b8b98;
    --accent: #a78bfa;
    --accent-2: #c4b5fd;
    --green: #98c379;
    --cyan: #56b6c2;
    --yellow: #e5c07b;
    --red: #e06c75;
    --blue: #61afef;
    --orange: #d19a66;
    --selection: rgba(167, 139, 250, .25);
    --window-bg: rgba(13,13,19,.92);
    --window-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.02) inset, 0 0 120px rgba(167,139,250,.06);
    --titlebar-tint: rgba(255,255,255,.03);
  }
  html.light {
    --bg: #f4f4f8;
    --surface: #ffffff;
    --surface-2: #ededf3;
    --border: #d9d9e3;
    --text: #2b2b34;
    --dim: #6d6d7a;
    --accent: #7c5cf0;
    --accent-2: #5b3ee8;
    --green: #478f3b;
    --cyan: #257c88;
    --yellow: #93701c;
    --red: #bd4441;
    --blue: #3362c9;
    --orange: #94531f;
    --selection: rgba(124, 92, 240, .2);
    --window-bg: rgba(255,255,255,.94);
    --window-shadow: 0 30px 80px rgba(40,40,70,.18), 0 0 0 1px rgba(0,0,0,.03) inset, 0 0 120px rgba(124,92,240,.08);
    --titlebar-tint: rgba(0,0,0,.02);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(167,139,250,.10), transparent),
      radial-gradient(ellipse 60% 40% at 90% 110%, rgba(86,182,194,.05), transparent);
    color: var(--text);
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    display: flex; align-items: center; justify-content: center;
    padding: clamp(8px, 3vw, 40px);
    overflow: hidden;
  }
  html.light body {
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(124,92,240,.09), transparent),
      radial-gradient(ellipse 60% 40% at 90% 110%, rgba(37,124,136,.05), transparent);
  }
  ::selection { background: var(--selection); }

  .window {
    width: min(920px, 100%);
    height: min(660px, 100%);
    background: var(--window-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--window-shadow);
    display: flex; flex-direction: column;
    overflow: hidden;
    backdrop-filter: blur(8px);
    animation: window-in .5s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes window-in { from { opacity: 0; transform: translateY(14px) scale(.985); } }

  /* title bar */
  .titlebar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    background: linear-gradient(var(--titlebar-tint), transparent);
    border-bottom: 1px solid var(--border);
    user-select: none; flex-shrink: 0;
  }
  .lights { display: flex; gap: 8px; }
  .light { width: 12px; height: 12px; border-radius: 50%; }
  .light.close { background: #ff5f57; } .light.min { background: #febc2e; } .light.max { background: #28c840; }
  .title {
    flex: 1; text-align: center; font-size: 12.5px; color: var(--dim);
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .ghost-btn { display: inline-flex; padding: 7px; cursor: pointer; border-radius: 8px; }
  .ghost-btn:hover { background: var(--titlebar-tint); }
  .ghost-btn svg { opacity: .85; }
  .ghost-btn:hover svg { opacity: 1; }
  .titlebar-spacer { width: 44px; }

  /* tabs */
  .tabs {
    display: flex; gap: 2px; padding: 6px 10px 0;
    background: var(--surface); border-bottom: 1px solid var(--border);
    flex-shrink: 0; overflow-x: auto; scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    padding: 7px 14px; font-size: 12px; color: var(--dim);
    border: 1px solid transparent; border-bottom: none;
    border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap;
    display: flex; align-items: center; gap: 6px;
    transition: color .15s, background .15s;
  }
  .tab:hover { color: var(--text); background: rgba(255,255,255,.03); }
  .tab.active {
    color: var(--accent-2); background: var(--surface-2);
    border-color: var(--border);
    position: relative;
  }
  .tab.active::after {
    content: ''; position: absolute; left: 10px; right: 10px; top: 0; height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--cyan)); border-radius: 2px;
  }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
  .tab.active .dot { background: var(--accent); box-shadow: 0 0 8px var(--accent); }

  /* terminal body */
  .term {
    flex: 1; overflow-y: auto; padding: 18px 20px 8px;
    font-size: 13.5px; line-height: 1.65; cursor: text;
    scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  }
  .term::-webkit-scrollbar { width: 8px; }
  .term::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .line { white-space: pre-wrap; word-break: break-word; min-height: 1.2em; }
  .line.cmdline { color: var(--text); }
  .ghost-prompt { color: var(--accent); font-weight: 600; }
  .path { color: var(--cyan); }
  .dollar { color: var(--dim); }
  .out { color: var(--dim); }
  .out b { color: var(--text); font-weight: 600; }
  .k { color: var(--accent-2); }
  .v { color: var(--text); }
  .ok { color: var(--green); }
  .warn { color: var(--yellow); }
  .err { color: var(--red); }
  .link { color: var(--blue); text-decoration: none; border-bottom: 1px dotted var(--blue); }
  .link:hover { color: var(--accent-2); border-color: var(--accent-2); }

  /* neofetch card */
  .fetch { display: flex; gap: 26px; margin: 6px 0; flex-wrap: wrap; min-width: 0; }
  .fetch-art { color: var(--accent); font-size: 11px; line-height: 1.25; font-weight: 600; user-select: none; min-width: 0; }
  .fetch-info { font-size: 12.5px; line-height: 1.75; min-width: 0; }
  .fetch-title { color: var(--accent-2); font-weight: 700; }
  .fetch-sep { color: var(--dim); }

  /* projects */
  .proj { margin: 10px 0 4px; padding-left: 14px; border-left: 2px solid var(--border); }
  .proj:hover { border-color: var(--accent); }
  .proj-name { color: var(--accent-2); font-weight: 700; font-size: 14px; }
  .proj-name .n { color: var(--dim); font-weight: 400; }
  .proj-desc { color: var(--text); margin: 2px 0; }
  .proj-meta { color: var(--dim); font-size: 12px; }
  .tag { color: var(--cyan); }
  .badge { color: var(--yellow); }

  /* input line */
  .input-line {
    display: flex; align-items: center; padding: 4px 20px 14px; flex-shrink: 0;
    cursor: text;
  }
  #prompt-span { white-space: nowrap; }
  #mirror {
    position: absolute; left: -9999px; top: 0; visibility: hidden;
    white-space: pre; pointer-events: none;
  }
  #input {
    flex: 0 1 auto; width: 2ch; min-width: 0; background: none; border: none; outline: none;
    color: var(--text); font: inherit; caret-color: transparent;
    margin-left: 8px; padding: 0;
  }
  .cursor {
    display: inline-block; width: 8.5px; height: 17px; margin-left: 1px;
    background: var(--accent); vertical-align: text-bottom;
    animation: blink 1.05s step-end infinite; border-radius: 1.5px;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* status bar */
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 5px 14px; font-size: 11px; color: var(--dim);
    background: var(--surface); border-top: 1px solid var(--border);
    user-select: none; flex-shrink: 0;
  }
  .statusbar .ghosty { color: var(--accent-2); }
  .statusbar .hint { color: var(--dim); }

  .float-ghost { position: fixed; font-size: 42px; pointer-events: none; z-index: 99;
    animation: floatby 3.2s ease-in-out forwards; }
  @keyframes floatby {
    0% { transform: translate(0, 40px) rotate(-6deg); opacity: 0; }
    15% { opacity: 1; }
    100% { transform: translate(120vw, -160px) rotate(8deg); opacity: 0; }
  }

  @media (max-width: 640px) {
    body { padding: 0; height: 100dvh; }
    .window {
      width: 100%; height: 100%;
      border: none; border-radius: 0; box-shadow: none;
    }
    .term { font-size: 12px; padding: 12px 12px 4px; overflow-x: hidden; }
    .tabs { padding: 5px 8px 0; gap: 1px; flex-wrap: wrap; }
    .tab { padding: 6px 7px; font-size: 11px; gap: 4px; }
    .tab .dot { width: 6px; height: 6px; }
    .fetch { flex-direction: column; gap: 10px; }
    .fetch-art { font-size: 8px; max-width: 100%; overflow: hidden; }
    .fetch-info { font-size: 12px; width: 100%; }
    .input-line { font-size: 12px; padding: 4px 12px 12px; }
    .statusbar { font-size: 10px; }
    .statusbar .hint { display: none; }
    .title span.t { display: none; }
  }
</style>
</head>
<body>
<div class="window" id="win">
  <div class="titlebar">
    <div class="lights"><div class="light close"></div><div class="light min"></div><div class="light max"></div></div>
    <div class="title">
      <span class="ghost-btn" id="ghost-btn" title="run the demo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
          <path d="M12 2C7 2 4 6.2 4 11v8.5c0 1.4 1.6 2 2.6 1.1L8 19.3l1.7 1.4c.7.6 1.7.6 2.5 0l1.6-1.4 1.7 1.4c1 .8 2.6.2 2.6-1.1V11C20 6.2 17 2 12 2Z" fill="#a78bfa"/>
          <circle cx="9.4" cy="11" r="1.5" fill="#0a0a0f"/><circle cx="14.6" cy="11" r="1.5" fill="#0a0a0f"/>
        </svg>
      </span>
      <span class="t">manish@portfolio: ~</span>
    </div>
    <div class="titlebar-spacer"></div>
  </div>

  <div class="tabs" id="tabs">
    <div class="tab active" data-cmd="neofetch"><span class="dot"></span>fetch</div>
    <div class="tab" data-cmd="whoami"><span class="dot"></span>whoami</div>
    <div class="tab" data-cmd="projects"><span class="dot"></span>projects</div>
    <div class="tab" data-cmd="skills"><span class="dot"></span>skills</div>
    <div class="tab" data-cmd="contact"><span class="dot"></span>contact</div>
  </div>

  <div class="term" id="term"></div>

  <div class="input-line" id="input-line">
    <span id="prompt-span"></span><span id="mirror" aria-hidden="true"></span><input id="input" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <span class="cursor" id="cursor"></span>
  </div>

  <div class="statusbar">
    <span><span class="ghosty">ghost</span> — a terminal portfolio</span>
    <span class="hint">type <b style="color:var(--accent-2)">help</b> · ↑↓ history · Tab completes</span>
  </div>
</div>

<script>
(() => {
  const term = document.getElementById('term');
  const input = document.getElementById('input');
  const tabs = [...document.querySelectorAll('.tab')];

  const USER = 'manish', HOST = 'arch';
  const promptHTML = `<span class="ghost-prompt">👻 ${USER}@${HOST}</span><span class="dollar">:</span><span class="path">~</span><span class="dollar">$ </span>`;
  document.getElementById('prompt-span').innerHTML = promptHTML;

  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const scroll = () => { term.scrollTop = term.scrollHeight; };

  const print = (html, cls='out') => {
    const d = document.createElement('div');
    d.className = 'line ' + cls;
    d.innerHTML = html;
    term.appendChild(d); scroll();
    return d;
  };
  const printCmd = (cmd) => print(`${promptHTML}${esc(cmd)}`, 'cmdline');

  const GHOST_ART = String.raw`
      .-"""-.        ~ Manish
     / _   _ \       ~ manish0467
    | (_) (_) |      ~ offline-first, native-first
     \  ^^^  /       ~ rust core · kotlin shell
      \____/         ~
    ___|===|___      ~ builds tools that work
   / |       | \     ~ without the cloud
  \ /  """""  \ /    ~
   \/\/\ | /\/\/     ~ 👻 rices his desktop
        |||          ~
`.slice(1, -1);

  const fetchLine = (k, v) => `<span class="fetch-title">${k}</span>: <span class="v">${v}</span>`;

  const PROJECTS = [
    { name: 'MovieBox-Android', url: 'https://github.com/manish0467/MovieBox-Android',
      desc: 'Native Android app for movies & TV on a shared Rust core',
      meta: `<span class="tag">Kotlin</span> · <span class="tag">Jetpack Compose</span> · <span class="tag">Media3</span> · <span class="badge">flagship</span>` },
    { name: 'MovieBox-Tui', url: 'https://github.com/manish0467/MovieBox-Tui',
      desc: 'Find, download & stream movies from the terminal — my fork is <b>40 commits ahead</b> of upstream',
      meta: `<span class="tag">Rust</span> · <span class="tag">TUI</span> · active contribution to <span class="tag">mesamirh/MovieBox-Tui</span>` },
    { name: 'flux', url: 'https://github.com/bjarneo/flux',
      desc: 'The Omarchy ↔ Android/Mac bridge I run daily — files, clipboard, notifications, phone-as-camera over LAN or Tailscale',
      meta: `<span class="tag">Go</span> · daily-driver tool · upstream <span class="tag">bjarneo/flux</span>` },
    { name: 'dotfiles', url: 'https://github.com/manish0467/dotfiles',
      desc: 'Full Omarchy/Hyprland desktop — 18 GNU Stow packages, Lua-configured window manager, MIT licensed',
      meta: `<span class="tag">Lua</span> · <span class="tag">Shell</span> · <span class="tag">GNU Stow</span> · 45+ custom scripts` },
    { name: 'Filee', url: 'https://github.com/KnifeLemon/Filee',
      desc: 'Offline converter — 263 formats, zero uploads. My Linux in-app updater & transactional upgrades shipped in the official v2.1.0',
      meta: `<span class="tag">C#</span> · <span class="tag">.NET</span> · <span class="badge">PR #360 merged upstream</span>` },
    { name: 'Flow', url: 'https://github.com/Flow-Tube/Flow',
      desc: 'YouTube client with local recommendations (contributing fork)',
      meta: `<span class="tag">Kotlin</span> · <span class="tag">Compose</span>` },
    { name: 'zapfast', url: 'https://github.com/crmne/zapfast',
      desc: 'Fast, native WhatsApp client (hacking fork)',
      meta: `<span class="tag">Rust</span> · <span class="tag">egui</span>` },
    { name: 'chaiType', local: true,
      desc: 'Typing trainer built for speed drills and custom modes',
      meta: `<span class="tag">TypeScript</span> · local build` },
  ];

  const SKILLS = {
    'languages': ['Rust', 'Kotlin', 'C# / .NET', 'TypeScript', 'JavaScript', 'Python', 'Go', 'Java', 'Bash', 'Lua'],
    'mobile': ['Android', 'Jetpack Compose', 'Media3', 'Gradle'],
    'desktop & tooling': ['Arch Linux', 'Omarchy / Hyprland', 'Neovim', 'tmux', 'Git', 'GNU Stow', 'starship'],
    'currently exploring': ['egui', 'Tauri-adjacent Rust GUIs', 'TUI frameworks', 'AI-assisted workflows'],
  };

  const COMMANDS = {
    help: () => `
<b>available commands</b>
  <span class="k">neofetch</span>      who am I, system-style  (<span class="k">fastfetch</span> works too)
  <span class="k">whoami</span>        the short version
  <span class="k">projects</span>      what I've built  → <span class="k">project &lt;name&gt;</span> for links
  <span class="k">skills</span>        toolbox
  <span class="k">contact</span>       reach me
  <span class="k">demo</span>          watch the terminal drive itself
  <span class="k">theme</span>         toggle dark / light  → <span class="k">theme light</span> · <span class="k">theme dark</span>
  <span class="k">ghost</span>         👀
  <span class="k">clear</span>         wipe the terminal   <span class="dim">(Ctrl+L too)</span>
  <span class="k">history</span>       what you typed
  <span class="k">echo</span> · <span class="k">date</span> · <span class="k">pwd</span> · <span class="k">ls</span>  the classics`,

    neofetch: () => `
<div class="fetch">
  <div class="fetch-art">${esc(GHOST_ART)}</div>
  <div class="fetch-info">
    <span class="fetch-title">manish</span>@<span class="fetch-title">arch</span>
    <span class="fetch-sep">───────────────</span>
    ${fetchLine('OS', 'Arch Linux (Omarchy)')}
    ${fetchLine('WM', 'Hyprland · configured in Lua')}
    ${fetchLine('shell', 'zsh + starship')}
    ${fetchLine('editor', 'neovim')}
    ${fetchLine('identity', 'rust core · kotlin compose shell')}
    ${fetchLine('philosophy', 'offline-first, native-first')}
    ${fetchLine('uptime', 'coding since the Java days, still shipping')}
    ${fetchLine('github', '<a class="link" href="https://github.com/manish0467" target="_blank" rel="noopener">@manish0467</a>')}
    <span class="fetch-sep">───────────────</span>
    <span style="color:#e06c75">███</span> <span style="color:#e5c07b">███</span> <span style="color:#98c379">███</span> <span style="color:#56b6c2">███</span> <span style="color:#61afef">███</span> <span style="color:#a78bfa">███</span>
  </div>
</div>`,

    whoami: () => `
<b>Manish</b> — <span class="k">@manish0467</span>
I build tools that are <b>fast, native and work offline</b>: a Rust core shared
between a terminal UI and an Android app, a converter that touches 263 formats
without uploading a byte, a YouTube client that recommends locally.
My code ships in other people's releases too — Filee's Linux updater is mine.
Off-screen I re-architect my Arch/Hyprland desktop for fun — it's all in my
<span class="k">dotfiles</span>. Currently deep in <span class="k">Rust</span> × <span class="k">Kotlin/Compose</span> land.`,

    projects: () => {
      let out = `<b>projects</b> — <span class="dim">${PROJECTS.length} repos, real links via</span> <span class="k">project &lt;name&gt;</span>\n`;
      PROJECTS.forEach((p, i) => {
        out += `<div class="proj"><span class="proj-name"><span class="n">${String(i+1).padStart(2,'0')} · </span>${p.name}</span>
<div class="proj-desc">${p.desc}</div><div class="proj-meta">${p.meta}</div></div>`;
      });
      return out;
    },

    skills: () => {
      let out = `<b>skills</b> — verified by pacman -Qo, not vibes\n`;
      for (const [group, items] of Object.entries(SKILLS)) {
        out += `\n<span class="k">${group}</span>\n  ${items.map(i => `<span class="tag">${esc(i)}</span>`).join(' · ')}\n`;
      }
      return out;
    },

    contact: () => `
<b>contact</b>
  <span class="k">github</span>   <a class="link" href="https://github.com/manish0467" target="_blank" rel="noopener">github.com/manish0467</a>
  <span class="k">profile</span>  <a class="link" href="https://github.com/manish0467" target="_blank" rel="noopener">@manish0467 on GitHub</a>
  <span class="k">dotfiles</span>  <a class="link" href="https://github.com/manish0467/dotfiles" target="_blank" rel="noopener">github.com/manish0467/dotfiles</a>
  <span class="k">email</span>    <a class="link" href="mailto:reshmimanish1977@gmail.com">reshmimanish1977@gmail.com</a>

<span class="dim">open to collaborating on Rust / Android / developer-tooling projects.</span>`,

    ghost: () => { spawnGhost(); return `<span class="ok">👻 boo. did you see it?</span>`; },

    theme: (args) => {
      const html = document.documentElement;
      const a = (args || '').toLowerCase();
      const light = a === 'light' ? true : a === 'dark' ? false : !html.classList.contains('light');
      html.classList.toggle('light', light);
      try { localStorage.setItem('theme', light ? 'light' : 'dark'); } catch (e) {}
      return `<span class="ok">theme → ${light ? 'light' : 'dark'}</span> <span class="dim">— ghostty respects your eyes too</span>`;
    },

    demo: () => { runDemo(); return `<span class="dim">rolling the demo — sit back 👻</span>`; },

    vim: () => `<span class="err">you are now trapped in vim.</span>\n<span class="dim">:q! is a lie. luckily this terminal forgives everything — just keep typing.</span>`,
    exit: () => `there is no exit. this is a portfolio, not a shell. 👻`,
    rm: (args) => (args || '').includes('-rf')
      ? `<span class="err">nice try.</span> the ghost backed everything up first.`
      : `rm: refusing to remove without -rf <span class="dim">(which also won't work)</span>`,

    ls: () => `about.txt   projects/   skills/   contact/   <span class="k">ghost.key</span> 👻`,
    pwd: () => `/home/manish/portfolio`,
    date: () => new Date().toString(),
    'cat about.txt': () => COMMANDS.whoami(),

    sudo: (args) => args && args.toLowerCase().includes('sandwich')
      ? `<span class="err">mannish is not in the sudoers file.</span> <span class="dim">this incident will be reported. 🍇</span>`
      : `<span class="err">nice try.</span> <span class="dim">privilege escalation is disabled on this portfolio.</span>`,

    history: () => history_.map((h, i) => `  ${String(i+1).padStart(3)}  ${esc(h)}`).join('\n') || '  (empty)',
  };
  COMMANDS.socials = COMMANDS.contact;
  COMMANDS.fastfetch = COMMANDS.neofetch;
  COMMANDS['project'] = (args) => {
    if (!args) return `usage: <span class="k">project &lt;name&gt;</span> — try ${PROJECTS.map(p=>p.name.toLowerCase()).slice(0,3).join(', ')}…`;
    const p = PROJECTS.find(p => p.name.toLowerCase().startsWith(args.toLowerCase()));
    if (!p) return `<span class="err">no project named '${esc(args)}'</span> — run <span class="k">projects</span> to list them`;
    return `<div class="proj"><span class="proj-name">${p.name}</span>
<div class="proj-desc">${p.desc}</div><div class="proj-meta">${p.meta}</div>
${p.url ? `<div class="proj-meta">→ <a class="link" href="${p.url}" target="_blank" rel="noopener">${p.url}</a></div>` : '<div class="proj-meta">→ local build, ask me about it</div>'}</div>`;
  };

  function spawnGhost() {
    const g = document.createElement('div');
    g.className = 'float-ghost'; g.textContent = '👻';
    g.style.top = (30 + Math.random()*40) + 'vh';
    document.body.appendChild(g);
    setTimeout(() => g.remove(), 3400);
  }

  // scripted typewriter demo (powers the `demo` command)
  async function runDemo() {
    const seq = ['clear', 'whoami', 'projects', 'ghost', 'theme'];
    for (const cmd of seq) {
      for (let i = 1; i <= cmd.length; i++) {
        input.value = cmd.slice(0, i);
        input.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(45 + Math.random() * 65);
      }
      await sleep(380);
      input.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
      await sleep(cmd === 'projects' ? 1400 : 800);
    }
  }

  // konami code → ghost swarm
  const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight','b','a'];
  let kIdx = 0;
  document.addEventListener('keydown', e => {
    kIdx = (e.key === KONAMI[kIdx]) ? kIdx + 1 : (e.key === KONAMI[0] ? 1 : 0);
    if (kIdx === KONAMI.length) {
      kIdx = 0;
      for (let i = 0; i < 6; i++) setTimeout(spawnGhost, i * 260);
      print(`<span class="ok">↑↑↓↓←→←→BA — ghost swarm deployed 👻👻👻</span>`);
    }
  });

  const history_ = [];
  let hIdx = -1;

  async function run(raw, {echo=true}={}) {
    const cmd = raw.trim();
    if (echo) printCmd(cmd);
    if (!cmd) return;
    history_.push(cmd); hIdx = history_.length;

    const [name, ...args] = cmd.split(/\s+/);
    const key = name.toLowerCase() === 'cat' ? 'cat about.txt' : name.toLowerCase();

    if (key === 'clear') { term.innerHTML = ''; return; }
    if (key === 'echo') { print(esc(args.join(' '))); return; }

    const fn = COMMANDS[key];
    if (fn) { const out = fn(args.join(' ')); if (out) print(out); }
    else print(`<span class="err">command not found: ${esc(name)}</span> — type <span class="k">help</span>`);
  }

  // input handling: history + tab completion
  const COMPLETIONS = Object.keys(COMMANDS).filter(c => !c.includes(' ')).concat(['clear']);
  const mirror = document.getElementById('mirror');
  const inputLine = document.getElementById('input-line');

  // Size the input to its text so the block cursor sits right after it.
  const syncCursor = () => {
    mirror.textContent = input.value;
    const cs = getComputedStyle(inputLine);
    const avail = inputLine.clientWidth
      - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)
      - document.getElementById('prompt-span').offsetWidth - 12;
    input.style.width = Math.max(14, Math.min(mirror.offsetWidth + 14, avail)) + 'px';
  };
  input.addEventListener('input', syncCursor);
  window.addEventListener('resize', syncCursor);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(syncCursor);
  inputLine.addEventListener('click', () => input.focus());
  syncCursor();

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const v = input.value; input.value=''; run(v); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); if (hIdx > 0) input.value = history_[--hIdx] || ''; }
    else if (e.key === 'ArrowDown') { e.preventDefault(); if (hIdx < history_.length) input.value = history_[++hIdx] || ''; }
    else if (e.key === 'Tab') {
      e.preventDefault();
      const v = input.value.toLowerCase();
      const hit = COMPLETIONS.filter(c => c.startsWith(v) && v);
      if (hit.length === 1) input.value = hit[0] + ' ';
      else if (hit.length > 0) print(hit.map(h=>`<span class="k">${h}</span>`).join('  '), 'out');
    }
    else if (e.key === 'l' && e.ctrlKey) { e.preventDefault(); term.innerHTML=''; }
    syncCursor();
  });
  term.addEventListener('click', () => input.focus());
  document.addEventListener('click', e => { if (!e.target.closest('.tab')) input.focus(); });

  // tabs drive the terminal
  tabs.forEach(t => t.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    run(t.dataset.cmd);
  }));

  // the title-bar ghost runs the demo
  const ghostBtn = document.getElementById('ghost-btn');
  if (ghostBtn) ghostBtn.addEventListener('click', () => run('demo'));

  // boot sequence
  (async () => {
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.classList.add('light'); } catch (e) {}
    print(`<span class="dim">ghost portfolio 1.0.0 — an interactive terminal. everything here is real data.</span>`);
    await sleep(350);
    printCmd('neofetch'); await sleep(280);
    print(COMMANDS.neofetch());
    await sleep(300);
    print(`<span class="dim">type <span class="k">help</span> to explore, or click the tabs above 👻</span>`);
    // #demo — shareable auto-playing tour (manish0467.github.io/portfolio/#demo)
    if (location.hash === '#demo') {
      await sleep(700);
      printCmd('demo');
      print(`<span class="dim">rolling the demo — sit back 👻</span>`);
      await runDemo();
    }
    input.focus();
  })();
})();
</script>
</body>
</html>
